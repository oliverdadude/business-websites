<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webbiz admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M16 22l8 22 8-16 8 16 8-22' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #111827; --muted: #6b7280; --faint: #9ca3af; --line: #e5e7eb; --line2: #f0f1f3;
    --brand: #4f46e5; --brand-soft: #eef2ff; --side: #0f1117; --side-ink: #c9cdd6; --side-hi: #ffffff;
    --ok: #059669; --warn: #b45309; --bad: #dc2626;
    --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg { display: block; flex: none; }

  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside.side { background: var(--side); color: var(--side-ink); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--side-hi); font-weight: 700; font-size: 15px; padding: 4px 10px 18px; }
  .logo .m { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; }
  .logo small { display: block; font-weight: 500; color: #7c8291; font-size: 12px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--side-ink); font-weight: 500; }
  .nav a:hover { background: #1b1e27; color: var(--side-hi); }
  .nav a.on { background: #232734; color: var(--side-hi); }
  .nav .count { margin-left: auto; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
  .nav .sub { padding-left: 38px; font-size: 13px; }
  .side .foot { margin-top: auto; font-size: 12px; color: #6b7080; padding: 10px; }

  main { min-width: 0; padding: 28px 32px 64px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .head h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .head p { margin: 2px 0 0; color: var(--muted); }
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 4px; display: inline-flex; gap: 6px; align-items: center; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel > .ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line2); }
  .panel > .ph h2 { font-size: 14px; margin: 0; }
  .panel > .pb { padding: 18px; }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
  .stack { display: grid; gap: 20px; }

  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 20px; }
  .tile { padding: 16px 18px; }
  .tile .k { color: var(--muted); font-size: 12px; font-weight: 500; }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
  .tile .s { color: var(--faint); font-size: 12px; }
  .funnel { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line2); margin: 6px 0 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; color: var(--ink); }
  .btn:hover { background: #f9fafb; border-color: #d1d5db; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: #4338ca; }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; outline: none; }
  input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  textarea.in { resize: vertical; min-height: 90px; }
  label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fields .full { grid-column: 1 / -1; }

  .actions { display: grid; gap: 14px; }
  .act { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 14px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line2); }
  .act > div:first-child { flex: 1 1 220px; }
  .act:last-of-type { border-bottom: 0; padding-bottom: 0; }
  .act b { display: block; font-size: 14px; }
  .act span { color: var(--muted); font-size: 13px; }
  .log { background: #0f1117; color: #d1d5db; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; max-height: 260px; overflow: auto; margin-top: 14px; }
  .log .err { color: #fca5a5; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner { display: flex; gap: 12px; padding: 12px 16px; border-radius: var(--radius); background: #fffbeb; border: 1px solid #fde68a; color: #92400e; margin-bottom: 20px; }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }

  table.t { width: 100%; border-collapse: collapse; }
  .t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fafafa; position: sticky; top: 0; }
  .t td { padding: 11px 14px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
  .t tr.click { cursor: pointer; }
  .t tr.click:hover td { background: #fafbff; }
  .t .name { font-weight: 600; }
  .t .sub { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-new { background: #f3f4f6; color: #4b5563; }
  .s-site_built { background: #eef2ff; color: #4338ca; }
  .s-contacted { background: #eff6ff; color: #1d4ed8; }
  .s-replied { background: #fef3c7; color: #b45309; }
  .s-won { background: #d1fae5; color: #047857; }
  .s-lost, .s-skipped { background: #f3f4f6; color: #6b7280; }
  .s-opted_out, .s-bounced { background: #fee2e2; color: #b91c1c; }
  .badge { background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip em { font-style: normal; opacity: .7; margin-left: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  /* Lead page */
  .lead-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); gap: 20px; align-items: start; }
  .browser { overflow: hidden; }
  .browser .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fafafa; }
  .dots { display: flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: #e5e7eb; }
  .url { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: #fff; }
  .frame-wrap { background: #e9ebef; height: 720px; overflow: hidden; position: relative; }
  .frame-wrap iframe { border: 0; background: #fff; width: 1280px; transform-origin: 0 0; display: block; }
  .frame-wrap.mobile { display: flex; justify-content: center; }
  .frame-wrap.mobile iframe { width: 390px; height: 100% !important; transform: none !important; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .nosite { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; padding: 20px; }

  .thread { display: grid; gap: 12px; }
  .msg { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fff; }
  .msg.in { border-color: #fde68a; background: #fffdf5; }
  .msg.unread { box-shadow: inset 3px 0 0 var(--brand); }
  .msg.draft { border-style: dashed; background: #fafafa; }
  .msg .mh { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .msg .mh b { color: var(--ink); }
  .msg .subj { font-weight: 600; margin-bottom: 6px; }
  .msg pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font: inherit; color: #374151; }
  .msg pre.clamp { max-height: 130px; overflow: hidden; mask-image: linear-gradient(#000 70%, transparent); }
  .more { font-size: 12px; font-weight: 600; cursor: pointer; color: var(--brand); background: none; border: 0; padding: 4px 0 0; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; background: var(--line2); color: var(--muted); }
  .tag.in { background: #fef3c7; color: #92400e; } .tag.bounce { background: #fee2e2; color: #b91c1c; }

  /* Mailbox */
  .mail { display: grid; grid-template-columns: 380px 1fr; min-height: 640px; overflow: hidden; }
  .mail .list { border-right: 1px solid var(--line); overflow: auto; max-height: calc(100vh - 170px); }
  .mail .item { padding: 12px 16px; border-bottom: 1px solid var(--line2); cursor: pointer; display: grid; gap: 2px; }
  .mail .item:hover { background: #fafbff; }
  .mail .item.on { background: var(--brand-soft); }
  .mail .item .top { display: flex; justify-content: space-between; gap: 8px; }
  .mail .item .who { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail .item.unread .who, .mail .item.unread .sj { font-weight: 700; }
  .mail .item .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .mail .item .sj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail .item .sn { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail .read { padding: 22px 26px; overflow: auto; max-height: calc(100vh - 170px); }
  .mail .read h2 { margin: 0 0 6px; font-size: 18px; }
  .mail .read .meta { color: var(--muted); font-size: 13px; margin-bottom: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mail .read pre { white-space: pre-wrap; word-wrap: break-word; font: inherit; font-size: 14px; color: #1f2937; margin: 0 0 22px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 12px; }
  .tabs a { padding: 12px 10px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
  .tabs a.on { color: var(--ink); border-color: var(--ink); }

  /* Sites */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .site-card { overflow: hidden; display: flex; flex-direction: column; }
  .thumb { position: relative; height: 190px; overflow: hidden; background: #e9ebef; border-bottom: 1px solid var(--line); cursor: pointer; }
  .thumb iframe { width: 1280px; height: 870px; transform: scale(.25); transform-origin: 0 0; border: 0; pointer-events: none; background: #fff; }
  .thumb.fit iframe { transform: scale(var(--s)); }
  .site-card .info { padding: 12px 14px; display: grid; gap: 8px; }
  .site-card .info .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .site-card .info .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .step { display: flex; gap: 10px; align-items: center; padding: 12px 14px; font-weight: 600; }
  .step .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--line2); color: var(--muted); flex: none; }
  .step.done .n { background: #d1fae5; color: var(--ok); }
  .step small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .help { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: #374151; font-size: 13px; margin-bottom: 14px; }
  .help ol { margin: 6px 0 0; padding-left: 18px; } .help li { margin: 3px 0; }
  .ok-line { color: var(--ok); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .welcome { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border-radius: var(--radius); padding: 22px 24px; margin-bottom: 20px; }
  .welcome h2 { margin: 0 0 4px; font-size: 18px; } .welcome p { margin: 0; opacity: .9; }
  @media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } }
  .toast { position: fixed; right: 20px; bottom: 20px; z-index: 50; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.2); font-weight: 500; max-width: 420px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { background: var(--bad); }
  .muted { color: var(--muted); } .small { font-size: 12px; }
  .hr { height: 1px; background: var(--line2); margin: 16px 0; }

  @media (max-width: 1200px) { .tiles { grid-template-columns: repeat(3, 1fr); } .lead-grid, .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px; }
    .logo { padding: 4px 10px; } .nav { display: flex; flex-wrap: wrap; } .nav .sub, .side .foot { display: none; }
    main { padding: 20px 16px 48px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .mail { grid-template-columns: 1fr; } .mail .list { max-height: 320px; border-right: 0; border-bottom: 1px solid var(--line); }
    .fields { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="m"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l4 12 5-9 5 9 4-12"/></svg></div><div><span id="bizname">webbiz</span><small>Admin</small></div></div>
    <nav class="nav">

    </nav>
    <div class="foot">Runs locally on your machine.</div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const h = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LABEL = { new: "New", site_built: "Site ready", contacted: "Contacted", replied: "Replied", won: "Won", lost: "Lost", opted_out: "Opted out", bounced: "Bounced", skipped: "Skipped" };
const COLORS = { new: "#9ca3af", site_built: "#6366f1", contacted: "#3b82f6", replied: "#f59e0b", won: "#10b981", lost: "#d1d5db", skipped: "#e5e7eb", opted_out: "#f87171", bounced: "#fca5a5" };
const pill = (s) => `<span class="pill s-${h(s)}">${h(LABEL[s] || s)}</span>`;
const cat = (c) => (c || "").split("=").pop().split(";")[0].replace(/_/g, " ").replace(/^\w/, (m) => m.toUpperCase());
let state = { leadsFilter: "", leadsQuery: "", mailSel: null };

function when(iso, long) {
  if (!iso) return "";
  const d = new Date(iso.endsWith("Z") || iso.includes("+") ? iso : iso + "Z"), s = (Date.now() - d) / 1000;
  if (long) return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 7) return Math.floor(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Webbiz": "1" }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

let toastTimer;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), err ? 6000 : 3000);
}
async function guard(fn) { try { return await fn(); } catch (e) { toast(e.message, true); } }

async function runAction(btn) {
  const name = btn.dataset.act, live = !!btn.dataset.live, body = { live };
  if (name === "find") { body.area = $("#area").value.trim(); body.radius = $("#radius").value; }
  if (live && !confirm("Send real emails now? This will email every queued lead (up to today's limit), pausing between each one.")) return;
  await guard(async () => { showJob(await api("/api/actions/" + name, body)); pollJob(); });
}
function showJob(job) {
  const log = $("#log"); if (!log) return;
  log.hidden = false;
  log.innerHTML = h(job.log || (job.running ? "Working…" : "")) + (job.error ? `\n<span class="err">${h(job.error)}</span>` : "");
  log.scrollTop = log.scrollHeight;
  const st = $("#jobstate"); if (st) st.innerHTML = job.running ? `<span class="row"><span class="spin"></span> Running ${h(job.name)}…</span>` : (job.name ? `Last: ${h(job.name)}${job.error ? " (failed)" : " ✓"}` : "");
  view.querySelectorAll("[data-act]").forEach((b) => { if (job.running) b.dataset.wasDisabled ??= b.disabled, b.disabled = true; else if (b.dataset.wasDisabled !== undefined) { b.disabled = b.dataset.wasDisabled === "true"; delete b.dataset.wasDisabled; } });
}
let polling = false;
async function pollJob() {
  if (polling) return; polling = true;
  try {
    while (true) {
      await new Promise((r) => setTimeout(r, 1000));
      const job = await api("/api/job"); showJob(job);
      if (!job.running) { if (location.hash === "" || location.hash === "#/") { await dashboard(); showJob(job); } refreshBadge(); job.error ? toast(job.error, true) : toast(`${job.name} finished`); break; }
    }
  } finally { polling = false; }
}

// ---------- Mailbox ----------
const STATE = {
  needs_you: ["Needs you", "s-opted_out"], needs_reply: ["Reply ready", "s-replied"], auto_sent: ["Auto-replied ✓", "s-won"],
  replied: ["Replied ✓", "s-contacted"], no_reply: ["No reply needed", "s-lost"], dismissed: ["Dismissed", "s-lost"],
};
const statePill = (m) => (m.direction === "in" && STATE[m.reply_state] ? `<span class="pill ${STATE[m.reply_state][1]}">${STATE[m.reply_state][0]}</span>` : "");
const intentTag = (m) => (m.intent ? `<span class="tag ${["unsubscribe", "complaint", "legal", "bounce"].includes(m.intent) ? "bounce" : "in"}">${h(m.summary && m.engine !== "ai" ? m.summary : m.intent.replace(/_/g, " "))}</span>` : "");

// The reply editor shared by the mailbox and the lead page.
function replyBox(m, leadName) {
  const pendingDraft = ["needs_reply", "needs_you"].includes(m && m.reply_state);
  const subject = m ? (m.draft_subject || (m.subject.startsWith("Re:") ? m.subject : "Re: " + m.subject)) : "Re: a website for " + leadName;
  return `${m && m.needs_human && pendingDraft ? `<div class="banner" style="margin:0 0 10px"><div><b>Needs you:</b> ${h(m.needs_human)}</div></div>` : ""}
    ${m && m.summary && m.engine === "ai" ? `<div class="muted small" style="margin-bottom:8px">AI summary: ${h(m.summary)}</div>` : ""}
    <input class="in" id="rsub" value="${h(subject)}" style="margin-bottom:8px">
    <textarea class="in" id="rbody" rows="${pendingDraft ? 12 : 6}" placeholder="Write a reply to ${h(leadName)}…">${pendingDraft ? h(m.draft_body) : ""}</textarea>
    ${pendingDraft && m.draft_body ? `<div class="muted small" style="margin-top:6px">Suggested reply (${m.engine === "ai" ? "written by AI" : "from your templates"}) — edit anything before sending.</div>` : ""}`;
}
function bindReply(leadId, msg, after) {
  const send = $("#send");
  if (send) send.addEventListener("click", () => guard(async () => {
    send.disabled = true; send.innerHTML = '<span class="spin"></span> Sending';
    try { await api(`/api/leads/${leadId}/reply`, { subject: $("#rsub").value, body: $("#rbody").value }); toast("Email sent"); refreshBadge(); after(); }
    finally { send.disabled = false; send.textContent = "Send email"; }
  }));
  const dismiss = $("#dismiss");
  if (dismiss && msg) dismiss.addEventListener("click", () => guard(async () => { await api(`/api/messages/${msg.id}/dismiss`, {}); toast("Marked as no reply needed"); refreshBadge(); after(); }));
}

    const pendingDraft = ["needs_reply", "needs_you"].includes(m.reply_state);
    $("#read").innerHTML = `<h2>${h(m.subject || "(no subject)")}</h2>
      <div class="meta">${incoming ? `From <b>${h(m.from_addr)}</b>` : `To <b>${h(m.to_addr)}</b>`}${m.created_at ? ` · ${h(when(m.created_at, true))}` : ""} · <a href="#/leads/${m.lead_id}">${h(m.name || "Open lead")} →</a> ${statePill(m)} ${intentTag(m)}</div>
      <pre>${h(m.body)}</pre>
      ${incoming && m.kind !== "bounce" && !["unsubscribe", "complaint", "legal"].includes(m.intent) ? `<div class="hr"></div>${replyBox(m, m.name)}
        <div class="row" style="justify-content:space-between;margin-top:10px">
          <span>${pendingDraft ? '<button class="btn sm ghost" id="dismiss">No reply needed</button>' : ""}</span>
          <span class="row"><a class="btn" href="#/leads/${m.lead_id}">View lead & site</a><button class="btn primary" id="send">Send email</button></span></div>`
      : `<a class="btn" href="#/leads/${m.lead_id}">View lead & site</a>`}`;
    if (incoming && !m.is_read) { m.is_read = 1; const el = view.querySelector(`.item[data-id="${m.id}"]`); el && el.classList.remove("unread"); api(`/api/leads/${m.lead_id}/read`, {}).then(refreshBadge); }
    bindReply(m.lead_id, m, () => { state.mailSel = null; mailPage(folder); });
  };
  view.querySelectorAll(".item").forEach((el) => el.addEventListener("click", () => show(items.find((m) => String(m.id) === el.dataset.id))));
  if (sel) show(sel);
  const sync = $("#sync");
  if (sync) sync.addEventListener("click", () => guard(async () => {
    sync.disabled = true; sync.innerHTML = '<span class="spin"></span> Checking';
    try {
      await api("/api/actions/sync", {});
      let job; do { await new Promise((r) => setTimeout(r, 1000)); job = await api("/api/job"); } while (job.running);
      job.error ? toast(job.error, true) : toast(job.log.split("\n").filter(Boolean).pop() || "Up to date");
    } finally { refreshBadge(); mailPage(folder); }
  }));
}

// ---------- Websites ----------
async function sitesPage() {
  setNav("sites");
  const rows = (await api("/api/leads")).filter((r) => r.slug);
  view.innerHTML = `
    <div class="head"><div><h1>Websites</h1><p>${rows.length} preview site${rows.length === 1 ? "" : "s"} built. Click one to open the lead.</p></div>
      <input class="in" id="sq" placeholder="Filter…" style="max-width:260px"></div>
    ${rows.length ? `<div class="gallery">${rows.map((r) => `<div class="panel site-card" data-n="${h((r.name + " " + r.city + " " + r.category).toLowerCase())}">
        <div class="thumb" data-id="${r.id}"><iframe loading="lazy" tabindex="-1" src="/sites/${encodeURIComponent(r.slug)}/" title="${h(r.name)}"></iframe></div>
        <div class="info"><div class="top"><span class="nm">${h(r.name)}</span>${pill(r.status)}</div>
          <div class="row" style="justify-content:space-between"><span class="muted small">${h(cat(r.category))}${r.city ? " · " + h(r.city) : ""}</span>
            <span class="row"><a class="btn sm" href="/sites/${encodeURIComponent(r.slug)}/" target="_blank" rel="noopener">Open ↗</a><a class="btn sm" href="#/leads/${r.id}">Lead</a></span></div></div></div>`).join("")}</div>`
    : `<div class="panel"><div class="empty"><b>No websites yet</b>Find leads and click “Build” on the dashboard.</div></div>`}`;
  const fit = () => view.querySelectorAll(".thumb").forEach((t) => { t.classList.add("fit"); t.style.setProperty("--s", t.clientWidth / 1280); });
  fit(); window.onresize = fit;
  view.querySelectorAll(".thumb").forEach((t) => t.addEventListener("click", () => (location.hash = "#/leads/" + t.dataset.id)));
  const q = $("#sq"); if (q) q.addEventListener("input", () => view.querySelectorAll(".site-card").forEach((c) => (c.style.display = c.dataset.n.includes(q.value.toLowerCase()) ? "" : "none")));
}

// ---------- Settings ----------
const PRESETS = {
  gmail: { smtp_host: "smtp.gmail.com", smtp_port: 587, imap_host: "imap.gmail.com" },
  zoho: { smtp_host: "smtp.zoho.com", smtp_port: 587, imap_host: "imap.zoho.com" },
};
async function settingsPage() {
  setNav("settings");
  const d = await api("/api/settings"), S = d.settings, E = d.email, N = d.netlify, A = d.ai;
  const steps = [["Your business", d.steps.business], ["Email account", d.steps.email], ["Website hosting", d.steps.hosting], ["Prices & limits", d.steps.prices]];
  const field = (sec, k, label, val, extra = "") => `<label class="f">${label}<input class="in" data-s="${sec}" data-k="${k}" value="${h(val ?? "")}" ${extra}></label>`;
  const isGmail = (E.smtp_host || "").includes("gmail");
  view.innerHTML = `
    <div class="head"><div><h1>Settings</h1><p>Everything is saved on this computer only. Passwords never leave it.</p></div></div>
    ${!d.configured ? `<div class="welcome"><h2>Welcome! Let's get you set up — about 10 minutes.</h2><p>Fill in the four sections below, top to bottom. Each one has a test button so you know it works.</p></div>` : ""}
    <div class="steps">${steps.map(([t, ok], i) => `<div class="panel step ${ok ? "done" : ""}"><span class="n">${ok ? "✓" : i + 1}</span><span>${t}<small>${ok ? "Done" : "To do"}</small></span></div>`).join("")}</div>
    <div class="stack" style="max-width:860px">
      <div class="panel"><div class="ph"><h2>1. Your business</h2></div><div class="pb">
        <div class="fields">
          ${field("settings", "business_name", "Business name (what customers see)", S.business_name === "Your Web Studio" ? "" : S.business_name, 'placeholder="e.g. Brex Web Studio"')}
          ${field("settings", "your_name", "Your name (signs the emails)", S.your_name === "Your Name" ? "" : S.your_name)}
          ${field("settings", "reply_to_email", "Your business email", S.reply_to_email.includes("example.com") ? "" : S.reply_to_email, 'type="email" placeholder="you@gmail.com"')}
          ${field("settings", "phone", "Phone (optional)", S.phone)}
          <label class="f full">Postal address — required by anti-spam law in every email (a PO box or virtual mailbox is fine)<input class="in" data-s="settings" data-k="postal_address" value="${h(S.postal_address)}"></label>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-save="settings">Save</button></div>
      </div></div>

      <div class="panel"><div class="ph"><h2>2. Email account</h2><span class="row">${E.has_password ? '<span class="ok-line">✓ Password saved</span>' : ""}</span></div><div class="pb">
        <div class="row" style="margin-bottom:12px"><span class="muted small">I use:</span><button class="btn sm" data-preset="gmail">Gmail / Google Workspace</button><button class="btn sm" data-preset="zoho">Zoho Mail</button><button class="btn sm" data-preset="other">Something else</button></div>
        <div class="help" id="gmailhelp" ${isGmail || !E.smtp_host ? "" : "hidden"}><b>Gmail needs an “App Password” (your normal password won't work):</b><ol>
          <li>Turn on 2-Step Verification: <a href="https://myaccount.google.com/signinoptions/twosv" target="_blank" rel="noopener">myaccount.google.com → Security</a></li>
          <li>Create an App Password at <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">myaccount.google.com/apppasswords</a> (name it “webbiz”).</li>
          <li>Copy the 16-letter code it shows and paste it below.</li></ol>
          <div style="margin-top:6px">Tip: use a separate address for outreach (not your personal one), so spam complaints can't affect your main inbox.</div></div>
        <div class="fields">
          ${field("email", "smtp_user", "Email address to send from", E.smtp_user, 'type="email"')}
          <label class="f">App password<input class="in" type="password" data-s="email" data-k="password" placeholder="${E.has_password ? "Saved — leave blank to keep" : "16-letter code"}" autocomplete="new-password"></label>
          ${field("email", "smtp_host", "Outgoing server (SMTP)", E.smtp_host)}
          ${field("email", "smtp_port", "Port", E.smtp_port, 'type="number"')}
          ${field("email", "imap_host", "Incoming server (IMAP) — for reading replies", E.imap_host)}
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-test="test-email">Send test email</button><button class="btn" data-test="test-inbox">Test inbox</button><button class="btn primary" data-save="email">Save</button></div>
      </div></div>

      <div class="panel"><div class="ph"><h2>3. Website hosting</h2>${S.preview_base_url ? `<span class="ok-line">✓ ${h(S.preview_base_url)}</span>` : ""}</div><div class="pb">
        <p class="muted" style="margin:0 0 12px">Your preview sites need to be online so the link in each email works. Netlify hosts them free.</p>
        <div class="help"><ol>
          <li>Sign up free at <a href="https://app.netlify.com/signup" target="_blank" rel="noopener">netlify.com</a>.</li>
          <li>Create a token at <a href="https://app.netlify.com/user/applications#personal-access-tokens" target="_blank" rel="noopener">User settings → Applications → Personal access tokens</a> → “New access token”.</li>
          <li>Paste it below and click <b>Connect</b>. webbiz creates the site and uploads your previews for you.</li></ol></div>
        <div class="fields">
          <label class="f full">Netlify token<input class="in" type="password" data-s="netlify" data-k="token" placeholder="${N.has_token ? "Saved — leave blank to keep" : "Paste token"}" autocomplete="off"></label>
        </div>
        <div class="row" style="justify-content:space-between;margin-top:14px">
          <details><summary class="muted small" style="cursor:pointer">Using other hosting?</summary><div style="margin-top:8px">${field("settings", "preview_base_url", "Address where output/sites is published", S.preview_base_url, 'placeholder="https://previews.example.com"')}<button class="btn sm" data-save="settings" style="margin-top:8px">Save address</button></div></details>
          <button class="btn primary" id="connect">${N.site_id ? "Reconnect" : "Connect"} Netlify</button></div>
      </div></div>

      <div class="panel"><div class="ph"><h2>4. Prices & sending limits</h2></div><div class="pb">
        <div class="fields">
          ${field("settings", "price_setup", "Setup price ($)", S.price_setup, 'type="number" min="0"')}
          ${field("settings", "price_monthly", "Monthly price ($)", S.price_monthly, 'type="number" min="0"')}
          ${field("settings", "daily_send_limit", "Max cold emails per day (start at 20–30)", S.daily_send_limit, 'type="number" min="1" max="500"')}
          ${field("settings", "followup_after_days", "Follow up after (days)", S.followup_after_days, 'type="number" min="1" max="60"')}
          <label class="f">Emails per business<select class="in" data-s="settings" data-k="max_emails_per_lead"><option value="2" ${S.max_emails_per_lead == 2 ? "selected" : ""}>2 (first email + one follow-up)</option><option value="1" ${S.max_emails_per_lead == 1 ? "selected" : ""}>1 (no follow-up)</option></select></label>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-save="settings">Save</button></div>
      </div></div>
      <div class="panel"><div class="ph"><h2>5. Replying to customers</h2>${A.ready ? '<span class="ok-line">✓ AI drafting on</span>' : '<span class="muted small">Using reply templates</span>'}</div><div class="pb">
        <p class="muted" style="margin:0 0 12px">Every reply is sorted automatically (interested, price question, wants changes, unsubscribe, out-of-office…) and gets a suggested answer built from the details below.</p>
        <label class="f" style="margin-bottom:12px">When a reply comes in
          <select class="in" data-s="settings" data-k="reply_mode">
            <option value="review" ${S.reply_mode === "review" ? "selected" : ""}>Draft a reply — I'll check and send it (recommended to start)</option>
            <option value="auto" ${S.reply_mode === "auto" ? "selected" : ""}>Send safe replies automatically — flag anything tricky for me</option>
          </select></label>
        <div class="help">In automatic mode, only routine answers go out by themselves: questions about price, what's included, timing, domains, who you are, change requests, and "yes, let's go". Anything involving discounts, custom work, payments, calls, complaints or legal threats always waits for you, and nobody gets more than 3 automatic replies. Unsubscribes, out-of-office replies and "no thanks" are never answered.</div>
        <div class="fields">
          ${field("settings", "payment_link", "Payment link for the setup fee (optional — e.g. a Stripe Payment Link)", S.payment_link, 'placeholder="https://buy.stripe.com/..."')}
          ${field("settings", "turnaround_days", "Days to get a site live", S.turnaround_days, 'type="number" min="1" max="60"')}
          <label class="f full">What's included (used in replies)<textarea class="in" data-s="settings" data-k="included" rows="4">${h(S.included)}</textarea></label>
          <label class="f full">Anything else the replies should know (optional)<textarea class="in" data-s="settings" data-k="reply_faq" rows="3" placeholder="e.g. Extra pages are $50 each. I also design logos for $99. I'm based in Bend and can meet in person.">${h(S.reply_faq)}</textarea></label>
          ${field("settings", "auto_sync_minutes", "Check for replies every (minutes, while the dashboard is open)", S.auto_sync_minutes, 'type="number" min="0" max="1440"')}
          <label class="f" style="align-self:end;flex-direction:row;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)"><input type="checkbox" data-s="settings" data-k="notify_needs_you" ${S.notify_needs_you ? "checked" : ""}> Email me when a reply needs me</label>
        </div>
        <div class="hr"></div>
        <b>AI-written replies (optional)</b>
        <p class="muted small" style="margin:4px 0 10px">With an Anthropic API key, Claude reads the whole conversation and writes a tailored reply for anything — including unusual questions the templates can't cover. It only uses the facts above and flags anything it isn't sure about. Costs a few cents per reply, billed by Anthropic.${A.package ? "" : ' <b>Needs the anthropic package:</b> close webbiz, run <code>pip install anthropic</code>, and start it again.'}</p>
        <div class="fields">
          <label class="f full">Anthropic API key — get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a><input class="in" type="password" data-s="ai" data-k="api_key" placeholder="${A.has_key ? "Saved — leave blank to keep" : "sk-ant-..."}" autocomplete="off"></label>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:14px">${A.has_key ? '<button class="btn sm ghost" id="rmkey">Remove key</button>' : ""}<button class="btn" data-test="test-ai">Test AI reply</button><button class="btn primary" data-save="ai">Save</button></div>
        <div id="aitest"></div>
      </div></div>
    </div>`;

  const collect = (sec) => Object.fromEntries([...view.querySelectorAll(`[data-s="${sec}"]`)].map((el) => [el.dataset.k, el.type === "checkbox" ? el.checked : el.value]));
  const save = async (secs) => { const body = {}; secs.forEach((sec) => (body[sec] = collect(sec))); await api("/api/settings", body); };
  view.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", () => guard(async () => {
    await save(b.dataset.save === "settings" ? ["settings"] : [b.dataset.save, "settings"]);
    toast("Saved"); refreshBadge(); settingsPage();
  })));
  view.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
    const p = PRESETS[b.dataset.preset] || { smtp_host: "", smtp_port: 587, imap_host: "" };
    Object.entries(p).forEach(([k, v]) => { const el = view.querySelector(`[data-s="email"][data-k="${k}"]`); if (el) el.value = v; });
    $("#gmailhelp").hidden = b.dataset.preset !== "gmail";
    const user = view.querySelector('[data-k="smtp_user"]'), biz = view.querySelector('[data-k="reply_to_email"]');
    if (!user.value && biz.value) user.value = biz.value;
  }));
  view.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", () => guard(async () => {
    const label = b.textContent; b.disabled = true; b.innerHTML = '<span class="spin"></span> Testing';
    try {
      await save(b.dataset.test === "test-ai" ? ["ai", "settings"] : ["email", "settings"]);
      const r = await api("/api/settings/" + b.dataset.test, {}); toast(r.message);
      if (r.reply_body !== undefined) $("#aitest").innerHTML = `<div class="msg in" style="margin-top:12px"><div class="mh"><span><b>Test customer wrote:</b> ${h(r.sample)}</span></div><div class="row" style="gap:6px;margin-bottom:6px"><span class="tag in">${h(r.intent)}</span>${r.needs_human ? `<span class="pill s-opted_out">Needs you: ${h(r.human_reason)}</span>` : ""}</div><pre>${h(r.reply_body)}</pre></div>`;
    }
    finally { b.disabled = false; b.textContent = label; }
  })));
  const rm = $("#rmkey");
  if (rm) rm.addEventListener("click", () => guard(async () => { await api("/api/settings", { ai: { remove_key: true } }); toast("API key removed"); settingsPage(); }));
  $("#connect").addEventListener("click", (e) => guard(async () => {
    const b = e.target; b.disabled = true; b.innerHTML = '<span class="spin"></span> Connecting';
    try {
      await save(["netlify", "settings"]);
      toast((await api("/api/settings/connect-netlify", {})).message);
      await api("/api/actions/publish", {}); settingsPage(); refreshBadge();
    } finally { b.disabled = false; }
  }));
}

// ---------- Router ----------
async function route() {
  const [path, qs] = (location.hash.slice(1) || "/").split("?");
  const params = new URLSearchParams(qs || "");
  window.onresize = null;
  try {
    let m;
    if (path === "/" || path === "") await dashboard();
    else if (path === "/leads") await leadsPage(params);
    else if ((m = path.match(/^\/leads\/(\d+)$/))) await leadPage(+m[1]);
    else if ((m = path.match(/^\/mail\/(todo|inbox|sent|queued)$/))) await mailPage(m[1]);
    else if (path === "/sites") await sitesPage();
    else if (path === "/settings") await settingsPage();
    else location.hash = "#/";
  } catch (e) {
    view.innerHTML = `<div class="panel"><div class="empty"><b>Something went wrong</b>${h(e.message)}</div></div>`;
  }
}
window.addEventListener("hashchange", () => { state.mailSel = null; route(); });
refreshBadge().then((s) => { if (s && !s.configured && (location.hash === "" || location.hash === "#/")) location.hash = "#/settings"; });
route();
setInterval(refreshBadge, 60000);
</script>
